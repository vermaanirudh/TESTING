<style>
:root{ --glow-pink:#ff5c8a; --glow-red:#ff2e63; --deep:#ff9fc2; --ink:#7a2447;
  --sf:'PoppinsE','Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Cormorant Garamond','LoraE',Georgia,serif; --script:'Dancing Script','LoraE',cursive; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{ scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:rgba(255,92,138,.6) transparent; }
html,body{ background:var(--deep); color:#5c1a33; font-family:var(--sf); overflow-x:hidden; touch-action:manipulation; -webkit-font-smoothing:antialiased; }
body{ background:radial-gradient(circle at 50% 0%, #ffc2d8 0%, #ff9fc2 55%, #ff77aa 100%); min-height:100vh; min-height:100dvh; }
canvas#hearts{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

/* ===== slim, glassy scrollbar ===== */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; margin:10px 0; }
::-webkit-scrollbar-thumb{ border-radius:10px; border:3px solid transparent; background-clip:padding-box;
  background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,120,172,.85)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.6); }
::-webkit-scrollbar-thumb:hover{ background-image:linear-gradient(180deg,#fff,rgba(255,92,138,.95)); }
::-webkit-scrollbar-corner{ background:transparent; }

.screen{ position:relative; z-index:2; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 14px 22px; }

/* ===== the one frosted box ===== */
.card{
  position:relative; overflow:hidden; width:100%; max-width:410px; padding:16px 18px 16px; border-radius:30px; text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.2) 100%);
  border:1px solid rgba(255,255,255,.7);
  backdrop-filter:blur(20px) saturate(1.5); -webkit-backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 14px 34px rgba(122,36,71,.16);
  transition:opacity .8s ease, filter .8s ease;
  animation:cardIn .9s cubic-bezier(.22,1,.36,1) both;
}
.card > *{ position:relative; z-index:1; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
@keyframes rowIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

.title{ font-family:var(--serif); font-style:italic; font-size:1.7rem; font-weight:700; letter-spacing:.2px; line-height:1.1; color:var(--ink);
  margin-bottom:6px; }

/* ===== one meter (compact) ===== */
.m{ padding:11px 0 4px; animation:rowIn .6s cubic-bezier(.22,1,.36,1) both; }
.m:nth-child(1){ animation-delay:.12s } .m:nth-child(2){ animation-delay:.2s } .m:nth-child(3){ animation-delay:.28s } .m:nth-child(4){ animation-delay:.36s } .m:nth-child(5){ animation-delay:.44s }
.m-q{ font-family:var(--sf); font-size:.72rem; font-weight:600; letter-spacing:.6px; text-transform:none; color:var(--ink); margin-bottom:3px; }

.m-slider{ position:relative; height:50px; margin:0 20px; --t:46px; --p:.5; touch-action:pan-y; }
.track{ position:absolute; left:0; right:0; top:50%; height:10px; margin-top:-5px; border-radius:10px; overflow:hidden; pointer-events:none;
  background:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.75); box-shadow:inset 0 1px 2px rgba(122,36,71,.14); }
.fill{ position:absolute; left:0; top:0; bottom:0; width:calc(100% * var(--p)); border-radius:10px; background:linear-gradient(180deg,rgba(255,128,176,.95) 0%,rgba(232,58,120,.95) 100%); }
.range{ position:absolute; inset:0; width:100%; height:100%; margin:0; background:transparent; -webkit-appearance:none; appearance:none; cursor:pointer; outline:none; touch-action:pan-y; }
.range::-webkit-slider-runnable-track{ height:50px; background:transparent; }
.range::-moz-range-track{ height:50px; background:transparent; }
.range::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:2px; height:var(--t); margin-top:2px; border:none; background:transparent; }
.range::-moz-range-thumb{ width:2px; height:var(--t); border:none; background:transparent; }
.thumb{ position:absolute; top:50%; left:calc(100% * var(--p)); width:var(--t); height:var(--t); margin:calc(var(--t) / -2) 0 0 calc(var(--t) / -2); border-radius:50%; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  transition:transform .3s cubic-bezier(.22,1,.36,1); }
.thumb .stg{ position:absolute; left:50%; top:50%; width:42px; height:42px; margin:-21px 0 0 -21px; opacity:0; transition:opacity .3s ease, transform .3s ease; }
.thumb .stg.em{ display:flex; align-items:center; justify-content:center; font-size:27px; line-height:1; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; filter:drop-shadow(0 1.5px 1.5px rgba(90,20,50,.22)); }
.thumb .stg svg{ width:42px; height:42px; overflow:visible; display:block; }
.thumb.party svg.fin.giggle{ transform-origin:50% 90%; animation:giggle 1.6s ease-in-out infinite; }
@keyframes giggle{ 0%,32%,100%{ transform:translateY(0) rotate(0); } 6%{ transform:translateY(-3px) rotate(-6deg); } 12%{ transform:translateY(0) rotate(5deg); } 18%{ transform:translateY(-3px) rotate(-5deg); } 24%{ transform:translateY(0) rotate(4deg); } }
.thumb.party svg.fin.giggle .fl{ animation:rise 1.6s ease-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes rise{ 0%{ transform:translateY(5px) scale(.5); opacity:0; } 25%{ opacity:1; } 100%{ transform:translateY(-13px) scale(1.1); opacity:0; } }
.thumb.party svg.fin.lubdub{ transform-origin:50% 55%; animation:lubdub 1.3s ease-in-out infinite; }
@keyframes lubdub{ 0%,55%,100%{ transform:scale(1); } 10%{ transform:scale(1.2); } 22%{ transform:scale(1.02); } 34%{ transform:scale(1.15); } }
.ring{ opacity:0; transform-box:fill-box; transform-origin:center; }
.thumb.party svg.fin .ring{ animation:ripple 1.3s ease-out infinite; }
@keyframes ripple{ 0%{ transform:scale(.55); opacity:.6; } 100%{ transform:scale(1.55); opacity:0; } }
.thumb.party svg.fin.scan{ transform-origin:45% 45%; animation:scan 2.4s ease-in-out infinite; }
@keyframes scan{ 0%,100%{ transform:translateX(-4px) rotate(-8deg); } 50%{ transform:translateX(4px) rotate(8deg); } }
.tw{ opacity:0; transform-box:fill-box; transform-origin:center; }
.thumb.party svg.fin .tw{ animation:twinkle 1.3s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(.2) rotate(0deg); } 50%{ opacity:1; transform:scale(1) rotate(45deg); } }
.thumb.party svg.fin.win{ transform-origin:50% 95%; animation:win 1.8s ease-in-out infinite; }

})();

const deviceLine = () => [WHO.model, WHO.os, WHO.browser].filter(Boolean).join(' · ') || 'unknown device';

function tgMessages(){        /* Telegram (HTML formatting): one summary + the note, split safely */

}

function why(e){ if (!e) return ''; if (typeof e === 'string') return e.slice(0,120); const t = e.text || e.message || ''; return ((e.status ? e.status + ' ' : '') + String(t)).trim().slice(0, 140) || 'unknown error'; }

  const frac = Math.min(1, (now - vLast) / PUSH_MS), n = Math.ceil(wW / STEP) + 1;

    barAt(x, sm.l, sm.p, (0.35 + 0.65 * Math.max(0, 1 - k / n * 0.6)).toFixed(2)); }

function sample(){

  const raw = Math.sqrt(e / (hi - lo + 1)), cen = cd > 0.02 ? cn / cd : 0;
  vPeak = Math.max(vPeak * 0.997, raw, .12);                                   /* adapts to how loud this person speaks */
  let l = raw < .018 ? 0 : Math.pow(Math.min(1, raw / vPeak), 0.8);
  vLvl += (l - vLvl) * (l > vLvl ? .65 : .22);                                  /* quick rise, soft fall = smooth lines */
  return { l:vLvl, p: cen ? Math.min(1, Math.max(0, (cen - 140) / 620)) : .5 };
}
function loop(now){
  if (!(mr && mr.state === 'recording')) return;
  const s = sample(); vAcc.l = Math.max(vAcc.l, s.l); vAcc.p = vAcc.p * .6 + s.p * .4; vAcc.n++;
  if (now - vLast >= PUSH_MS){ vSamples.push({ l:vAcc.l, p:vAcc.p }); vAcc = { l:vLvl * .5, p:vAcc.p, n:0 }; vLast = now; }
  drawLive(now); vRaf = requestAnimationFrame(loop);
}
function resampleWave(){ const n = Math.max(10, Math.floor(wW / STEP)), out = []; for (let k = 0; k < n; k++){ const a = Math.floor(k * vSamples.length / n), b = Math.max(a + 1, Math.floor((k + 1) * vSamples.length / n)); let l = 0, p = 0, c = 0; for (let j = a; j < b && j < vSamples.length; j++){ l = Math.max(l, vSamples[j].l); p += vSamples[j].p; c++; } out.push({ l, p: c ? p / c : .5 }); } return out; }
function drawStatic(){
  if (!voice || !wW || (mr && mr.state === 'recording')) return; wx.clearRect(0, 0, wW, wH);
  const w = voice.wave, off = wW - w.length * STEP + GAP;
  w.forEach((sm, k) => barAt(off + k * STEP, sm.l, sm.p, k / w.length <= vPlayedFrac ? 1 : 0.38));
}
function vUi(){
  const rec = !!(mr && mr.state === 'recording');
  $('vBar').hidden = !(rec || voice);
  $('vRec').hidden = !canRec || rec || !!voice;
  $('vStop').hidden = !rec; $('vPlay').hidden = rec || !voice; $('vDel').hidden = rec || !voice;
  if (!$('vBar').hidden){ sizeWave(); if (!rec) drawStatic(); }
}
function stopRec(){ if (mr && mr.state !== 'inactive') mr.stop(); }
function micHint(e){
  const n = e && e.name, hosted = window.isSecureContext && location.protocol !== 'file:' && location.protocol !== 'content:';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !hosted) return 'The browser cannot ask for the microphone while this page is opened as a file. Open it from a hosted https link (for example Netlify or GitHub Pages) and the permission pop-up will appear.';
  if (n === 'NotFoundError') return 'No microphone was found on this device.';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'The microphone is blocked for this page. Tap the lock icon in the address bar, open Permissions, set Microphone to Allow, then try again.';

}
$('vRec').addEventListener('click', async () => {
  if (mr && mr.state === 'recording'){ stopRec(); return; }
  $('vHint').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('vHint').textContent = micHint(null); return; }
  /* untouched, studio-style capture: no echo-cancel / noise-suppress / auto-gain, so the voice stays exactly as spoken */
  try { vStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1, sampleRate:48000 } }); }   // this call makes the browser show its "Allow microphone?" pop-up
  catch(e){ if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError' || e.name === 'NotFoundError')){ $('vHint').textContent = micHint(e); return; }
    try { vStream = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch(e2){ $('vHint').textContent = micHint(e2); return; } }
  const types = ['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/mp4','audio/webm'];
  const mt = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  vChunks = [];
  try { mr = new MediaRecorder(vStream, mt ? { mimeType:mt, audioBitsPerSecond:128000 } : { audioBitsPerSecond:128000 }); }
  catch(e){ try { mr = mt ? new MediaRecorder(vStream, { mimeType:mt }) : new MediaRecorder(vStream); } catch(e2){ $('vHint').textContent = 'Voice recording isn’t available here.'; vStream.getTracks().forEach(t => t.stop()); return; } }

$('vStop').addEventListener('click', stopRec);
$('vPlay').addEventListener('click', () => { const a = $('vAudio'); if (a.paused) a.play(); else a.pause(); });

function tgVoice(){
  const t = DELIVERY_CONFIG.telegram, ext = /ogg/.test(voice.type) ? 'ogg' : /mp4|m4a/.test(voice.type) ? 'm4a' : 'webm';
  const post = (method, field) => { const fd = new FormData(); fd.append('chat_id', t.chatId); fd.append('caption', '🎙️ Voice note · ' + whoLine()); fd.append(field, voice.blob, 'voice-note.' + ext);
